[project]
name = "flex_bom"
authors = [{ name = "Honey Bird", email = "admin@honey-bird.net" }]
description = "Flexible BOMs for ERPNext v15 — one BOM usable by many items, item groups, variants or attribute values, selectable at Work Order creation time."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
